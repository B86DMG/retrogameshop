<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - Retro Game Shop</title>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Pixelify+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/products.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="header-container">
        <!-- Mobile Menu Toggle -->
        <input type="checkbox" id="menu-toggle" />
        <label for="menu-toggle" class="menu-icon">
          <i class="fas fa-bars"></i>
        </label>

        <!-- Logo and Social - Left Side -->
        <div class="logo-social-wrapper">
          <a href="index.html" class="logo">
            <img src="images/logo.png" alt="Retro Game Shop Logo" />
          </a>
          <div class="social-links">
            <span class="social-label">Follow us:</span>
            <div class="social-icons">
              <a href="#" class="social-link" aria-label="Facebook">
                <i class="fab fa-facebook-f"></i>
              </a>
              <a href="#" class="social-link" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
              </a>
              <a href="#" class="social-link" aria-label="Twitter">
                <i class="fab fa-x-twitter"></i>
              </a>
            </div>
          </div>
        </div>

        <!-- Navigation - Centered -->
        <nav class="navbar">
          <a href="index.html" class="nav-link">Home</a>
          <a href="index.html#about" class="nav-link">About</a>
          <a href="products.html" class="nav-link">Products</a>
          <a href="products_firebase.html" class="nav-link">Products (F)</a>
          <a href="index.html#contact" class="nav-link">Contact</a>
        </nav>

        <!-- Header Actions - Right Side -->
        <div class="header-actions">
          <a href="#" class="icon-link" aria-label="Wishlist">
            <i class="fas fa-heart"></i>
          </a>
          <a href="cart.html" class="icon-link" aria-label="Shopping Cart">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-badge">0</span>
          </a>
          <div class="user-menu">
            <a href="#" class="icon-link" id="user-btn" aria-label="User Menu">
              <i class="fas fa-user"></i>
            </a>
            <div class="dropdown-menu" id="user-dropdown">
              <a href="admin.html">Admin (Mock API)</a>
              <a href="admin_firebase.html">Admin (Firebase)</a>
              <a href="#">Profile</a>
              <a href="#">Orders</a>
              <a href="#">Logout</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="products-main">
      <section class="products-section">
        <div class="container">
          <h1 class="section-title">All Products</h1>
          <div class="product-container"></div>
        </div>
      </section>

      <aside class="products-aside">
        <h2>Filtre</h2>

        <div class="filter-group">
          <h3>Categorii</h3>
          <label>
            <input type="checkbox" name="category" value="consoles" />
            Console
          </label>
          <label>
            <input type="checkbox" name="category" value="games" />
            Jocuri
          </label>
          <label>
            <input type="checkbox" name="category" value="accessories" />
            Accesorii
          </label>
        </div>

        <div class="filter-group">
          <h3>Subcategorii</h3>
          <label>
            <input type="checkbox" name="subcategory" value="retro" />
            Retro
          </label>
          <label>
            <input type="checkbox" name="subcategory" value="modern" />
            Modern
          </label>
        </div>

        <div class="filter-group">
          <h3>Stare</h3>
          <label>
            <input type="checkbox" name="condition" value="nou" /> Nou
          </label>
          <label>
            <input type="checkbox" name="condition" value="second-hand" />
            Second Hand
          </label>
        </div>

        <div class="filter-group">
          <h3>Preț</h3>
          <label>
            <input type="checkbox" name="price" value="0-100" /> 0 - 100 RON
          </label>
          <label>
            <input type="checkbox" name="price" value="100-300" /> 100 - 300
            RON
          </label>
          <label>
            <input type="checkbox" name="price" value="300+" /> 300+ RON
          </label>
        </div>

        <button class="apply-filters">Aplică filtre</button>
      </aside>
    </main>

    <!-- Load products.js FIRST, then app.js -->
    <script src="js/products.js"></script>
    <script>
      // Prevent app.js from overriding displayProducts on this page
      window.PRODUCTS_PAGE_LOADED = true;
    </script>
    <script src="js/app.js"></script>
  </body>
</html>
