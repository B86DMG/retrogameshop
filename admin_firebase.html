<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Retro Game Shop (Firebase)</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Pixelify+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="header-container">
        <!-- Mobile Menu Toggle -->
        <input type="checkbox" id="menu-toggle" />
        <label for="menu-toggle" class="menu-icon">
          <i class="fas fa-bars"></i>
        </label>

        <!-- Logo and Social - Left Side -->
        <div class="logo-social-wrapper">
          <a href="index.html" class="logo">
            <img src="images/logo.png" alt="Retro Game Shop Logo" />
          </a>
          <div class="social-links">
            <span class="social-label">Follow us:</span>
            <div class="social-icons">
              <a href="#" class="social-link" aria-label="Facebook">
                <i class="fab fa-facebook-f"></i>
              </a>
              <a href="#" class="social-link" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
              </a>
              <a href="#" class="social-link" aria-label="Twitter">
                <i class="fab fa-x-twitter"></i>
              </a>
            </div>
          </div>
        </div>

        <!-- Navigation - Centered -->
        <nav class="navbar">
          <a href="index.html" class="nav-link">Home</a>
          <a href="index.html#about" class="nav-link">About</a>
          <a href="products.html" class="nav-link">Products</a>
          <a href="products_firebase.html" class="nav-link">Products (F)</a>
          <a href="index.html#contact" class="nav-link">Contact</a>
        </nav>

        <!-- Header Actions - Right Side -->
        <div class="header-actions">
          <a href="#" class="icon-link" aria-label="Wishlist">
            <i class="fas fa-heart"></i>
          </a>
          <a href="cart.html" class="icon-link" aria-label="Shopping Cart">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-badge">0</span>
          </a>
          <div class="user-menu">
            <a href="#" class="icon-link" id="user-btn" aria-label="User Menu">
              <i class="fas fa-user"></i>
            </a>
            <div class="dropdown-menu" id="user-dropdown">
              <a href="admin.html">Admin (Mock API)</a>
              <a href="admin_firebase.html">Admin (Firebase)</a>
              <a href="#">Profile</a>
              <a href="#">Orders</a>
              <a href="#">Logout</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="admin-container">
      <h1 class="admin-title">Admin Panel <span class="title-accent">(Firebase)</span></h1>

      <form id="product-form" class="admin-form">
        <h2>Add/Edit Product</h2>
        <input type="text" id="nume" placeholder="Nume produs" required />
        <input type="text" id="pret" placeholder="Pret" required />
        <input type="url" id="imageURL" placeholder="Image URL" required />
        <input type="text" id="description" placeholder="Description" required />
        <input type="text" id="categorie" placeholder="categorie" required />
        <input type="text" id="subcategorie" placeholder="subcategorie" required />
        <input type="number" id="cantitate" placeholder="cantitate" required />
        <input type="number" id="stare" placeholder="stare" required />
        <button id="add-btn" class="btn btn-primary">Add Product</button>
      </form>

      <div class="admin-table-container">
        <h2>Product List</h2>
        <table id="products-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Image</th>
              <th>Name</th>
              <th>Price</th>
              <th>Description</th>
              <th>State</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Products will be inserted here -->
          </tbody>
        </table>
      </div>
    </div>

    <script type="module" src="js/admin_firebase.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
